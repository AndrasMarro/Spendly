<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker>
    <symbol id="file" viewBox="0 0 16 20"><path d="M1 1h9l5 5v13H1z" fill="#fff" stroke="#667085" stroke-width="1.4"/><path d="M10 1v5h5" fill="none" stroke="#667085" stroke-width="1.4"/></symbol>
    <symbol id="pdf" viewBox="0 0 16 20"><path d="M1 1h9l5 5v13H1z" fill="#fff" stroke="#dc2626" stroke-width="1.4"/><path d="M10 1v5h5" fill="none" stroke="#dc2626" stroke-width="1.4"/><rect x="3" y="11" width="10" height="5" rx="1" fill="#dc2626"/></symbol>
    <symbol id="folder" viewBox="0 0 22 18"><path d="M1 3a2 2 0 0 1 2-2h5l2 2.5h9a2 2 0 0 1 2 2V15a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2z" fill="#fbbf24" stroke="#d97706" stroke-width="1.2"/></symbol>
  </defs>
  <rect width="960" height="420" rx="18" fill="#f6f7f9"/>

  <!-- Browser / Spendly -->
  <rect x="32" y="40" width="330" height="270" rx="14" fill="#fff" stroke="#e4e7ec" stroke-width="1.5"/>
  <rect x="32" y="40" width="330" height="34" rx="14" fill="#eef0f4"/><rect x="32" y="60" width="330" height="14" fill="#eef0f4"/>
  <circle cx="54" cy="57" r="5" fill="#f87171"/><circle cx="70" cy="57" r="5" fill="#fbbf24"/><circle cx="86" cy="57" r="5" fill="#34d399"/>
  <rect x="104" y="49" width="238" height="16" rx="8" fill="#fff"/><text x="116" y="61" font-size="11" fill="#667085">andrasmarro.github.io/spendly</text>
  <text x="54" y="108" font-size="20" font-weight="700" fill="#1b1f24">Spendly</text>
  <text x="54" y="128" font-size="12" fill="#667085">läuft komplett in deinem Browser</text>
  <rect x="54" y="144" width="136" height="58" rx="10" fill="#eef2ff"/><text x="66" y="166" font-size="11" fill="#667085">Monatlich</text><text x="66" y="190" font-size="18" font-weight="700" fill="#1b1f24">CHF 753</text>
  <rect x="202" y="144" width="136" height="58" rx="10" fill="#eef2ff"/><text x="214" y="166" font-size="11" fill="#667085">Rechnungen</text><text x="214" y="190" font-size="18" font-weight="700" fill="#1b1f24">10 PDFs</text>
  <rect x="54" y="216" width="200" height="10" rx="5" fill="#4f46e5"/><rect x="54" y="236" width="120" height="10" rx="5" fill="#818cf8"/><rect x="54" y="256" width="80" height="10" rx="5" fill="#a5b4fc"/><rect x="54" y="276" width="50" height="10" rx="5" fill="#c7d2fe"/>

  <!-- Arrows -->
  <path d="M376 150 H580" stroke="#4f46e5" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <path d="M580 200 H376" stroke="#4f46e5" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#ah)"/>
  <text x="478" y="134" font-size="13" font-weight="600" fill="#1b1f24" text-anchor="middle">speichern &amp; hochladen</text>
  <text x="478" y="226" font-size="13" font-weight="600" fill="#1b1f24" text-anchor="middle">laden &amp; durchsuchen</text>
  <rect x="404" y="160" width="148" height="26" rx="13" fill="#eef2ff"/><text x="478" y="178" font-size="12" fill="#4f46e5" text-anchor="middle">🔒 Google-Login</text>

  <!-- Google Drive -->
  <rect x="596" y="40" width="332" height="270" rx="14" fill="#fff" stroke="#e4e7ec" stroke-width="1.5"/>
  <text x="620" y="76" font-size="18" font-weight="700" fill="#1b1f24">Dein Google Drive</text>
  <use href="#folder" x="620" y="96" width="22" height="18"/><text x="650" y="110" font-size="14" font-weight="600" fill="#1b1f24">Meine Ablage</text>
  <path d="M631 118 V176 M631 140 H648 M631 176 H648" stroke="#d0d5dd" stroke-width="1.5" fill="none"/>
  <use href="#file" x="652" y="130" width="16" height="20"/><text x="676" y="145" font-size="13" fill="#1b1f24">spendly-data.json</text><text x="676" y="160" font-size="11" fill="#667085">Abos, Kategorien, Einstellungen</text>
  <use href="#folder" x="650" y="168" width="22" height="18"/><text x="680" y="182" font-size="13" font-weight="600" fill="#1b1f24">Spendly Rechnungen</text>
  <path d="M661 190 V266 M661 206 H676 M661 236 H676 M661 266 H676" stroke="#d0d5dd" stroke-width="1.5" fill="none"/>
  <use href="#pdf" x="680" y="196" width="16" height="20"/><text x="704" y="211" font-size="13" fill="#1b1f24">swisscom-2026-10.pdf</text>
  <use href="#pdf" x="680" y="226" width="16" height="20"/><text x="704" y="241" font-size="13" fill="#1b1f24">krankenkasse-oktober.pdf</text>
  <use href="#pdf" x="680" y="256" width="16" height="20"/><text x="704" y="271" font-size="13" fill="#1b1f24">strom-q3-2026.pdf</text>

  <!-- No server -->
  <rect x="32" y="336" width="896" height="56" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="480" y="360" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">Kein Spendly-Server dazwischen</text>
  <text x="480" y="380" font-size="13" fill="#047857" text-anchor="middle">Deine Daten gehen direkt vom Browser in dein Drive. Spendly sieht nur Dateien, die es selbst angelegt hat.</text>
</svg>
